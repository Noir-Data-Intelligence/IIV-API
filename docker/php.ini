; Ajustes mínimos de produção sobre a imagem base php:8.2-fpm-alpine.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; validate_timestamps=0 exige rebuild da imagem a cada deploy de código —
; aceitável aqui porque o código nunca é montado por bind mount em produção.
opcache.validate_timestamps = 0
