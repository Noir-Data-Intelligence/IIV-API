# NOTA DE SEGURANÇA: `docker compose` lê por omissão um ficheiro chamado
# `.env` na raiz do projecto para interpolar ${VAR} — o MESMO NOME que o
# Laravel usa para o `.env` de desenvolvimento local (APP_DEBUG=true,
# APP_ENV=local). Para nunca misturar os dois, usar sempre
# `docker compose --env-file .env.docker ...` (nunca o `.env` de dev) — ver
# README.md secção "Deploy com Docker". Como defesa adicional, APP_ENV/
# APP_DEBUG/LOG_LEVEL ficam FIXOS abaixo (não interpoláveis) — mesmo que o
# `.env` errado seja lido por engano, um container de produção nunca arranca
# em modo debug.
x-app-env: &app-env
  APP_NAME: ${APP_NAME:-SIG-IIV}
  APP_ENV: production
  APP_KEY: "${APP_KEY:?defina APP_KEY em .env.docker, gerado com \"php artisan key:generate --show\"}"
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-https://api.iiv.noirdataintelligence.com}
  APP_LOCALE: pt
  APP_FALLBACK_LOCALE: pt
  LOG_CHANNEL: stack
  LOG_LEVEL: info
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-sig_iiv}
  DB_USERNAME: ${DB_USERNAME:-sig_iiv}
  DB_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD em .env.docker}"
  # Domínio real do frontend dockerizado (ver Front-end/docker-compose.yml,
  # label `traefik.http.routers.iiv.rule`). Sobrepor via .env.docker para
  # testar localmente (ex.: localhost:8080).
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-iiv.noirdataintelligence.com}
  FRONTEND_URL: ${FRONTEND_URL:-https://iiv.noirdataintelligence.com}
  SESSION_DRIVER: database
  SESSION_LIFETIME: 120
  # Sem isto, a cookie de sessão do backend (api.iiv.noirdataintelligence.com)
  # nunca seria enviada de volta pelo browser em pedidos para o frontend
  # (iiv.noirdataintelligence.com) — subdomínios distintos exigem uma cookie
  # de domínio partilhado. Sobrepor para `null` em dev local (mesma origem
  # via localhost não precisa disto).
  SESSION_DOMAIN: ${SESSION_DOMAIN:-.noirdataintelligence.com}
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  MAIL_MAILER: ${MAIL_MAILER:-log}
  CHAT_LLM_PROVIDER: ${CHAT_LLM_PROVIDER:-}
  CHAT_LLM_API_KEY: ${CHAT_LLM_API_KEY:-}

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sig_iiv}
      POSTGRES_USER: ${DB_USERNAME:-sig_iiv}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD em .env.docker}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Serviço one-shot: corre as migrations e sai. `app`/`queue` só arrancam
  # depois deste terminar com sucesso — evita migrations em duplicado ou
  # corridas em paralelo quando escalado horizontalmente.
  migrate:
    build: .
    command: ["php", "artisan", "migrate", "--force"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue:
    build: .
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3"]
    environment:
      <<: *app-env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    # `proxy` liga este serviço ao mesmo Traefik externo do frontend (ver
    # Front-end/docker-compose.yml) — subdomínio próprio, mesmo padrão.
    # `default` mantém-se para falar com `app`/`postgres`/etc.
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sig-iiv-api.rule=Host(`api.iiv.noirdataintelligence.com`)"
      - "traefik.http.routers.sig-iiv-api.entrypoints=websecure"
      - "traefik.http.routers.sig-iiv-api.tls=true"
      - "traefik.http.routers.sig-iiv-api.tls.certresolver=<CERTRESOLVER>"
      - "traefik.http.services.sig-iiv-api.loadbalancer.server.port=80"

networks:
  default:
  proxy:
    external: true

volumes:
  postgres_data:
  storage_data:
