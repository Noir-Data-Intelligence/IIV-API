# NOTA DE SEGURANÇA: `docker compose` lê por omissão um ficheiro chamado
# `.env` na raiz do projecto para interpolar ${VAR} — o MESMO NOME que o
# Laravel usa para o `.env` de desenvolvimento local (APP_DEBUG=true,
# APP_ENV=local). Para nunca misturar os dois, usar sempre
# `docker compose --env-file .env.docker ...` (nunca o `.env` de dev) — ver
# README.md secção "Deploy com Docker". Como defesa adicional, APP_ENV/
# APP_DEBUG/LOG_LEVEL ficam FIXOS abaixo (não interpoláveis) — mesmo que o
# `.env` errado seja lido por engano, um container de produção nunca arranca
# em modo debug.
x-app-env: &app-env
  APP_NAME: ${APP_NAME:-SIG-IIV}
  APP_ENV: production
  APP_KEY: "${APP_KEY:?defina APP_KEY em .env.docker, gerado com \"php artisan key:generate --show\"}"
  APP_DEBUG: "false"
  # Mesmo host do frontend, servido via PathPrefix no Traefik (ver labels do
  # serviço `nginx` abaixo) — nunca um subdomínio `api.` próprio. Auditoria
  # de segurança (2026-08-09): um `SESSION_DOMAIN` com wildcard
  # (`.noirdataintelligence.com`) tornava a cookie de sessão acessível a
  # QUALQUER subdomínio do domínio da agência (cookie tossing/CSRF token
  # fixation a partir de um subdomínio comprometido de outro cliente).
  # Mesma origem elimina o problema na raiz: sem wildcard, sem CORS
  # cross-origin sequer a configurar.
  APP_URL: ${APP_URL:-https://iiv.noirdataintelligence.com}
  APP_LOCALE: pt
  APP_FALLBACK_LOCALE: pt
  LOG_CHANNEL: stack
  LOG_LEVEL: info
  # BD MySQL externa, já provisionada — sem container/volume local a gerir
  # aqui (ver README.md "Deploy com Docker"). Host/username/password nunca
  # com valor por omissão: têm de vir sempre de .env.docker (nunca
  # versionado), para a topologia/credenciais reais nunca ficarem no git.
  DB_CONNECTION: mysql
  DB_HOST: "${DB_HOST:?defina DB_HOST em .env.docker}"
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-iiv_db}
  DB_USERNAME: "${DB_USERNAME:?defina DB_USERNAME em .env.docker}"
  DB_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD em .env.docker}"
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-iiv.noirdataintelligence.com}
  FRONTEND_URL: ${FRONTEND_URL:-https://iiv.noirdataintelligence.com}
  SESSION_DRIVER: database
  SESSION_LIFETIME: 120
  # Sem valor -> âmbito da cookie é o host exacto do pedido (mesma origem
  # do frontend, ver nota de APP_URL acima). Nunca um wildcard.
  SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
  # Atrás de TLS real (Traefik) em produção; sobrepor para "false" só em
  # dev local sobre HTTP simples (.env.docker), nunca em produção.
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-strict}
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  MAIL_MAILER: ${MAIL_MAILER:-log}
  CHAT_LLM_PROVIDER: ${CHAT_LLM_PROVIDER:-}
  CHAT_LLM_API_KEY: ${CHAT_LLM_API_KEY:-}

services:
  # Serviço one-shot: corre as migrations e sai. `app`/`queue` só arrancam
  # depois deste terminar com sucesso — evita migrations em duplicado ou
  # corridas em paralelo quando escalado horizontalmente. Sem `depends_on`
  # de BD: liga-se directamente ao servidor MySQL externo (DB_HOST em
  # .env.docker), não há container local para esperar/health-checkar.
  migrate:
    build: .
    command: ["php", "artisan", "migrate", "--force"]
    environment:
      <<: *app-env

  app:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue:
    build: .
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3"]
    environment:
      <<: *app-env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # SEM publicação de porta no host: em produção, o único caminho de
    # entrada é o Traefik (rede `proxy`, TLS terminado lá). Publicar
    # ${APP_PORT:-8000} directamente no host era um bypass total do Traefik
    # — HTTP simples, sem qualquer middleware/WAF/rate-limit do proxy
    # (auditoria de segurança, 2026-08-09). Para testar localmente sem
    # Traefik, usar um `docker-compose.override.yml` próprio (não
    # versionado) a re-adicionar `ports:`.
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    # `proxy` liga este serviço ao mesmo Traefik externo do frontend (ver
    # Front-end/docker-compose.yml). `default` mantém-se para falar com `app`.
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      # MESMO host do frontend (Front-end/docker-compose.yml, router `iiv`)
      # — só `/api`, `/sanctum` (rota de CSRF cookie do Sanctum, fora do
      # prefixo /api) e `/docs` (Swagger/OpenAPI, Gate::viewApiDocs restringe
      # a admin fora de local — ver README.md) vêm parar aqui. Prioridade
      # explícita mais alta do que o router `iiv` (Host simples) para o
      # Traefik nunca hesitar entre os dois quando ambos correspondem.
      - "traefik.http.routers.sig-iiv-api.rule=Host(`iiv.noirdataintelligence.com`) && (PathPrefix(`/api`) || PathPrefix(`/sanctum`) || PathPrefix(`/docs`))"
      - "traefik.http.routers.sig-iiv-api.priority=100"
      - "traefik.http.routers.sig-iiv-api.entrypoints=websecure"
      - "traefik.http.routers.sig-iiv-api.tls=true"
      - "traefik.http.routers.sig-iiv-api.tls.certresolver=<CERTRESOLVER>"
      - "traefik.http.services.sig-iiv-api.loadbalancer.server.port=80"

networks:
  default:
  proxy:
    external: true

volumes:
  storage_data:
