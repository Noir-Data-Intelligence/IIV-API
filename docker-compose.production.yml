services:

  migrate:
    build: .
    command: ["php", "artisan", "migrate", "--force"]
    environment: &app-env
      APP_NAME: ${APP_NAME:-SIG-IIV}
      APP_ENV: production
      APP_KEY: "${APP_KEY:?defina APP_KEY em .env.docker}"
      APP_DEBUG: "false"
      APP_URL: https://apiiiv.noirdataintelligence.com

      APP_LOCALE: pt
      APP_FALLBACK_LOCALE: pt

      LOG_CHANNEL: stack
      LOG_LEVEL: info

      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:?defina DB_HOST em .env.docker}"
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-iiv_db}
      DB_USERNAME: "${DB_USERNAME:?defina DB_USERNAME em .env.docker}"
      DB_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD em .env.docker}"

      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-iiv.noirdataintelligence.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://iiv.noirdataintelligence.com}

      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: strict

      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: database
      CACHE_STORE: database

      MAIL_MAILER: ${MAIL_MAILER:-log}

      CHAT_LLM_PROVIDER: ${CHAT_LLM_PROVIDER:-}
      CHAT_LLM_API_KEY: ${CHAT_LLM_API_KEY:-}

    networks:
      - iiv
      - proxy


  app:
    build: .
    restart: unless-stopped

    environment:
      <<: *app-env

    volumes:
      - storage_data:/var/www/html/storage

    depends_on:
      migrate:
        condition: service_completed_successfully

    networks:
      - iiv


  queue:
    build: .
    restart: unless-stopped

    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--tries=3",
        "--timeout=90",
        "--sleep=3"
      ]

    environment:
      <<: *app-env

    volumes:
      - storage_data:/var/www/html/storage

    depends_on:
      migrate:
        condition: service_completed_successfully

    networks:
      - iiv


  nginx:
    image: nginx:alpine
    restart: unless-stopped

    expose:
      - "80"

    volumes:
      - ./public:/var/www/html/public:ro
      - storage_data:/var/www/html/storage
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - iiv
      - proxy


networks:

  iiv:
    driver: bridge

  proxy:
    external: true


volumes:
  storage_data: