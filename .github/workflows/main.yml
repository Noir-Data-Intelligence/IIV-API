name: Deploy Laravel API

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            set -e

            echo "======================================"
            echo "🚀 Starting Laravel API deployment"
            echo "======================================"

            cd /opt/projects/IIV-API

            echo ""
            echo "📥 Updating repository..."

            git fetch origin master
            git reset --hard origin/master

            echo ""
            echo "🐳 Building Docker containers..."

            docker compose \
              -f docker-compose.production.yml \
              --env-file .env.docker \
              build

            echo ""
            echo "🚀 Starting containers..."

            docker compose \
              -f docker-compose.production.yml \
              --env-file .env.docker \
              up -d

            echo ""
            echo "🔁 Restarting nginx (fastcgi_pass resolve o IP do app uma só vez, ao arrancar — tem de ser reiniciado sempre que o container app é recriado, senão fica a apontar para um IP morto e devolve 502)..."

            docker compose \
              -f docker-compose.production.yml \
              --env-file .env.docker \
              restart nginx

            echo ""
            echo "⏳ Waiting for application..."

            sleep 10

            echo ""
            echo "🗄️ Running database migrations..."

            docker compose \
              -f docker-compose.production.yml \
              --env-file .env.docker \
              exec -T app \
              php artisan migrate --force

            echo ""
            echo "🌱 Running reference data seeders (idempotent)..."

            docker compose \
              -f docker-compose.production.yml \
              --env-file .env.docker \
              exec -T app \
              php artisan db:seed --class=EstacaoSeeder --force

            docker compose \
              -f docker-compose.production.yml \
              --env-file .env.docker \
              exec -T app \
              php artisan db:seed --class=EvaluationCycleSeeder --force

            echo ""
            echo "🧹 Clearing Laravel cache..."

            docker compose \
              -f docker-compose.production.yml \
              --env-file .env.docker \
              exec -T app \
              php artisan optimize:clear

            echo ""
            echo "⚡ Optimizing Laravel..."

            docker compose \
              -f docker-compose.production.yml \
              --env-file .env.docker \
              exec -T app \
              php artisan config:cache

            docker compose \
              -f docker-compose.production.yml \
              --env-file .env.docker \
              exec -T app \
              php artisan route:cache

            docker compose \
              -f docker-compose.production.yml \
              --env-file .env.docker \
              exec -T app \
              php artisan view:cache

            echo ""
            echo "⏰ Ensuring Laravel Scheduler cron entry is active..."

            CRON_CMD="* * * * * cd /opt/projects/IIV-API && docker compose -f docker-compose.production.yml --env-file .env.docker exec -T app php artisan schedule:run >> /dev/null 2>&1"

            ( crontab -l 2>/dev/null | grep -F "artisan schedule:run" > /dev/null ) || \
            ( ( crontab -l 2>/dev/null; echo "$CRON_CMD" ) | crontab - )

            echo ""
            echo "🔎 Checking containers..."

            docker compose \
              -f docker-compose.production.yml \
              --env-file .env.docker \
              ps

            echo ""
            echo "❤️ Checking Laravel application..."

            curl --fail --silent --show-error \
              https://apiiiv.noirdataintelligence.com/up

            echo ""
            echo "🧹 Removing unused Docker images..."

            docker image prune -f

            echo ""
            echo "======================================"
            echo "✅ Deployment completed successfully"
            echo "======================================"
